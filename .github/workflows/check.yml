name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clear orig/sum-pc for the retail checkout
        shell: pwsh
        run: |
          if (Test-Path orig/sum-pc) { Remove-Item -Recurse -Force orig/sum-pc }
          New-Item -ItemType Directory -Force -Path orig/sum-pc | Out-Null

      - name: Checkout Retail Binary
        uses: actions/checkout@v4
        with:
          repository: AARosson48/SummonerDecomp-retail
          token: ${{ secrets.RETAIL_BINARY_TOKEN }}
          path: orig/sum-pc

      - name: Verify orig/sum-pc/Sum.exe
        shell: pwsh
        run: |
          $hash = (Get-FileHash orig/sum-pc/Sum.exe -Algorithm SHA1).Hash
          if ($hash -ne "CDC5D71D447A89E9A1C5E176C65C9B129321D7FC") {
            throw "sha1 $hash"
          }

      - name: Checkout MSVC 6
        uses: actions/checkout@v4
        with:
          repository: itsmattkc/MSVC600
          path: msvc6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ninja
        run: pip install ninja

      - name: Download dtk and objdiff
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/bin | Out-Null
          curl.exe -fsSL -o tools/bin/dtk.exe https://github.com/openblack/decomp-toolkit/releases/download/v0.0.27/dtk-windows-x86_64.exe
          curl.exe -fsSL -o tools/bin/objdiff-cli.exe https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-windows-x86_64.exe

      - name: Split, compile, and write the objdiff report
        shell: pwsh
        env:
          MSVC6_ROOT: ${{ github.workspace }}/msvc6
        run: |
          python configure.py
          ninja

      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: sum-pc_report
          path: build/report.json

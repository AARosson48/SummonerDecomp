name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Clear orig/sum-pc for the retail checkout
        run: rm -rf orig/sum-pc && mkdir -p orig/sum-pc

      - name: Checkout Retail Binary
        uses: actions/checkout@v4
        with:
          repository: AARosson48/SummonerDecomp-retail
          token: ${{ secrets.RETAIL_BINARY_TOKEN }}
          path: orig/sum-pc

      - name: Verify orig/sum-pc/Sum.exe
        run: |
          echo "cdc5d71d447a89e9a1c5e176c65c9b129321d7fc  orig/sum-pc/Sum.exe" | sha1sum -c -

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Download dtk and objdiff
        run: |
          mkdir -p tools/bin
          curl -fsSL -o tools/bin/dtk \
            https://github.com/openblack/decomp-toolkit/releases/download/v0.0.27/dtk-linux-x86_64
          curl -fsSL -o tools/bin/objdiff-cli \
            https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          chmod +x tools/bin/dtk tools/bin/objdiff-cli

      - name: Split Sum.exe and write the objdiff report
        run: |
          python configure.py
          ninja

      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: sum-pc_report
          path: build/report.json

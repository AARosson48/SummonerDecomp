name: Build

on:
  push:
  pull_request:

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Configure
        run: python configure.py
      - name: Progress report
        run: python tools/progress.py --report build/report.json
      - name: Upload decomp.dev report
        uses: actions/upload-artifact@v4
        with:
          name: sum-pc_report
          path: build/report.json
